<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folding Card Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card-wrapper" tabindex="0" aria-label="Interactive folding card">
    <div class="card-cover">
      <div class="cover-front">
        <span class="cover-eyebrow">Interactive experience</span>
        <h2>Discover<br><span>More</span></h2>
        <p class="cover-note">Hover to unfold the card</p>
        <span class="cover-line"></span>
      </div>
      <div class="cover-back">
        <span>Inside view</span>
      </div>
    </div>

    <section class="card-inside" aria-live="polite">
      <span class="inside-eyebrow">New perspective</span>
      <h3>Surprise!</h3>
      <p>A polished, high-contrast panel designed to make your message stand out.</p>
      <button class="action-btn" type="button">Explore now</button>
    </section>
  </main>
</body>
</html>
